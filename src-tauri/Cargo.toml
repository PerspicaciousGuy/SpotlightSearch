[package]
name = "gleam-search"
version = "0.1.0"
edition = "2021"
description = "A fast, local file and app launcher for Windows"
license = "MIT"
authors = ["PerspicaciousGuy"]
repository = "https://github.com/PerspicaciousGuy/gleam"
publish = false

[lib]
name = "gleam_search"

[[bin]]
name = "gleam-search"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-global-shortcut", "dep:open", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
dirs = "6"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
open = { version = "5", optional = true }

# Shell icon extraction (src/icons.rs). Same versions Tauri already resolves, so nothing new compiles.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }
png = "0.18"
